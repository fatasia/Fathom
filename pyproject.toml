[project]
name = "fathom-industrial-semantic-core"
version = "0.1.0"
description = "渊渟 FATHOM：轻量工业本体、语义层与智能体执行底座"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "keyring>=25.6,<26",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=27,<30",
  "sqlite-vec>=0.1.6,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
connectors-sql = [
  "oracledb>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "pyodbc>=5.2,<6",
]
connectors-industrial = [
  "asyncua>=1.1,<2",
  "paho-mqtt>=2.1,<3",
  "taos-ws-py>=0.7,<1",
]
connectors-context = [
  "elasticsearch>=9,<10",
  "neo4j>=5.28,<7",
  "qdrant-client>=1.15,<2",
  "redis>=6,<7",
]

[project.scripts]
fathom = "fathom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/fathom"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
