        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-5.6-sol
          provider: langgenius/openai/openai
        prompt_template:
        - id: fathom-system
          role: system
          text: '你是渊渟 FATHOM 的工业数据助手。FATHOM 工具负责企业事实、指标口径、权限与证据。

            回答规则：

            1. FATHOM 返回经过验证的数值或结论时，忠实使用，不重新计算、不改写数值。

            2. FATHOM 明确表示没有企业事实数据时：如果用户询问本企业的数值、状态、原因或预测，必须说明当前没有可验证数据并给出接入建议，禁止编造。

            3. 如果用户询问概念、方法、通用知识、使用帮助或普通对话，即使企业数据尚未接入，也要使用你的通用知识自然回答。

            4. 回答简洁清楚；不要向普通用户展示 JSON、内部字段名或工具调用细节。'
        - id: fathom-user
          role: user
          text: '用户问题：{{#sys.query#}}


            FATHOM 受控结果：{{#fathom.text#}}'
        selected: false
        title: 可信回答
        type: llm
        vision:
