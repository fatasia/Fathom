openapi: 3.0.3
info:
  title: FATHOM Industrial Semantic Tools
  version: 0.1.0
  description: 供 Dify Workflow、Agent 和其他上层 AI 调用的受控工业语义工具。
servers:
  - url: http://host.docker.internal:8000/api/v1
    description: Dify Docker 访问宿主机 FATHOM
  - url: http://127.0.0.1:8000/api/v1
    description: 非容器本机联调
security: []
paths:
  /semantics/assets:
    get:
      operationId: search_semantics
      summary: 搜索工业对象、指标、关系、事件和权限定义
      parameters:
        - in: query
          name: query
          schema: { type: string }
          description: 业务术语或对象名称
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: 语义资产列表
          content:
            application/json:
              schema: { type: object }
  /query/answer:
    post:
      operationId: ask_data
      summary: 可信问数并直接返回适合聊天展示的答案文本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, description: 用户的业务问题 }
      responses:
        "200":
          description: 可直接发送给用户的答案文本
          content:
            text/plain:
              schema:
                type: string
  /query/ask:
    post:
      operationId: ask_data_structured
      summary: 可信问数并返回计划、数据、证据和追踪信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, description: 用户的业务问题 }
      responses:
        "200":
          description: 结构化问数结果
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /knowledge/search:
    post:
      operationId: search_enterprise_knowledge
      summary: 统一检索 FATHOM 内置与外接企业知识库并返回来源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: 用户的问题或检索词 }
                knowledge_base_keys:
                  type: array
                  items: { type: string }
                  description: 可选；留空检索全部已启用知识库
                top_k: { type: integer, default: 5, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: 按相关度排序且带来源的知识片段
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        content: { type: string }
                        source_uri: { type: string }
                        score: { type: number }
                        knowledge_base_key: { type: string }
                  warnings:
                    type: array
                    items: { type: string }
  /ontology/instances/{object_id}/context:
    get:
      operationId: get_object_context
      summary: 获取业务对象及其一跳关系上下文
      parameters:
        - in: path
          name: object_id
          required: true
          schema: { type: string }
          description: 已注册的业务对象唯一标识
      responses:
        "200":
          description: 对象、属性、来源和关联对象
          content:
            application/json:
              schema: { type: object }
  /agent-mesh/runs:
    post:
      operationId: run_controlled_agent_flow
      summary: 执行内置的受控智能体链路
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_key]
              properties:
                flow_key:
                  type: string
                  enum: [trusted_qa, guided_onboarding, adaptive_diagnosis]
                question: { type: string }
                source_key: { type: string }
                scope:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: 包含步骤回执、trace 和受控输出的运行结果
          content:
            application/json:
              schema: { type: object }
